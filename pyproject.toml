[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electionlab"
version = "0.12.0"
description = "Local-first U.S. presidential election and campaign simulation sandbox."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "openai>=1.60",
  "keyring>=25.5",
  "certifi>=2025.8",
]

[project.scripts]
electionlab = "electionlab.main:main"

[tool.setuptools.packages.find]
include = ["electionlab*"]

[tool.setuptools.package-data]
electionlab = [
  "data/**/*.json",
  "data/**/*.svg",
  "data/**/*.png",
  "data/**/*.bin",
]
